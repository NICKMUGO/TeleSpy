#cloud-config
# First-boot setup for the TeleSpy Azure VM (passed as --custom-data by
# deploy/azure-provision.sh): Docker, the /opt/telespy app folder, ML job
# logs (rotated weekly), swap for the 1 GB Standard_B1s, automatic security
# updates, and Nairobi time for deploy/ml.crontab.
timezone: Africa/Nairobi
package_update: true
packages:
  - unattended-upgrades
swap:
  filename: /swapfile
  size: 3G
write_files:
  - path: /etc/logrotate.d/telespy
    content: |
      /var/log/telespy/*.log {
        weekly
        rotate 8
        compress
        missingok
        notifempty
        copytruncate
      }
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker azureuser
  - install -d -o azureuser -g azureuser /opt/telespy /opt/telespy/data /var/log/telespy

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Offline · TeleSpy</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f6;
        --fg: #18181b;
        --muted: #71717a;
        --brand: #c21725;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --fg: #fafafa;
          --muted: #a1a1aa;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0 0 1.25rem;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 8px;
        padding: 0.6rem 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        TeleSpy needs a connection to show live SIM, billing and ticket data. It
        will load as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
